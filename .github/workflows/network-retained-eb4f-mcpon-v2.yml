name: retained a54 MCP-on public config qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: network-retained-a54-mcpon-v1-once
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: eliza-research/thenetwork
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed helper bytes
        env:
          EXPECTED_PINS_SHA256: b4c91b161b235912e14fa5798ffb453f83632df4a9e6bfb2c8641c3a4ef5b4c7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==os.environ['GITHUB_SHA']
          root=Path('.github/runtime-a54-mcpon-v1')
          data=(root/'PINS.json').read_bytes()
          assert hashlib.sha256(data).hexdigest()==os.environ['EXPECTED_PINS_SHA256']
          pins=json.loads(data)
          assert set(pins)=={'qualify.py','setup.ts','probe.ts','oci_to_docker.py','EXPECTED-IMAGE.json'}
          for name,pin in pins.items():
              path=root/name
              assert path.is_file() and not path.is_symlink()
              raw=path.read_bytes()
              assert len(raw)==pin['bytes'] and hashlib.sha256(raw).hexdigest()==pin['sha256']
          PY
      - name: Fetch only retained completed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39614220938 --repo eliza-research/thenetwork --name backend-candidate-a54d85c-39614220938-1 --dir .github/runtime-a54-mcpon-v1/artifact
      - name: Qualify actual image once
        run: python3 .github/runtime-a54-mcpon-v1/qualify.py
      - name: Retain small receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: network-a54-mcpon-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/runtime-a54-mcpon-v1/receipts/
          if-no-files-found: error
          retention-days: 7
